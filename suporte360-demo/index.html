<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPORTE 360 • Inteligência Operacional</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#081321;--panel:#101f33;--panel2:#14263d;--line:#253b50;--txt:#e9f3ff;--muted:#91a8bb;--blue:#51c9ff;--green:#4cdeb3;--gold:#f3c778;--red:#ff8e94}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:67px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0c1b2e;position:sticky;top:0;z-index:10}.brand{font-size:23px;letter-spacing:.02em;font-weight:900}.brand b{color:var(--blue)}.tag{font-size:11px;padding:7px 10px;background:#163d4a;border:1px solid #225e68;border-radius:99px;color:#87e4e8}.shell{display:flex;min-height:calc(100vh - 67px)}aside{width:235px;flex-shrink:0;padding:25px 14px;border-right:1px solid var(--line);background:#0d1a2a}.menu{display:flex;align-items:center;width:100%;gap:10px;padding:13px 15px;background:none;color:var(--muted);border:0;border-radius:11px;text-align:left;font-weight:650;margin:3px 0}.menu.on,.menu:hover{color:white;background:#1b3650}.menu.on{box-shadow:inset 3px 0 var(--blue)}aside small{display:block;color:#7192a8;letter-spacing:1.2px;margin:10px 12px 16px}main{flex:1;min-width:0;padding:32px;max-width:1650px}.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:25px}h1{font-size:30px;margin:0 0 8px;letter-spacing:-.7px}p{color:var(--muted);margin:0;line-height:1.5}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#1a3249;color:var(--txt);padding:11px 15px;border-radius:11px;font-weight:700}.btn.primary{background:var(--blue);color:#072031;border-color:var(--blue)}.btn:hover{filter:brightness(1.14)}.layout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:linear-gradient(150deg,var(--panel),#102033);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}.kpi .label{color:var(--muted);font-size:13px}.kpi strong{font-size:31px;display:block;letter-spacing:-1px;margin:14px 0 7px}.kpi .delta{font-size:12px;color:var(--green)}.span2{grid-column:span 2}.span4{grid-column:span 4}.card h3{font-size:15px;margin:0 0 15px}.chart{height:250px;position:relative}.section{display:none}.section.active{display:block}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px}td,th{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}td{font-size:13px}.pill{background:#183f40;color:#7ee9be;border:1px solid #28665c;border-radius:20px;padding:5px 9px;font-size:11px}.rank{color:var(--gold);font-weight:800}.avatar{display:inline-grid;place-items:center;background:#24455e;width:33px;height:33px;border-radius:50%;margin-right:7px;font-size:11px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.collect{position:relative;min-height:228px;border:1px solid #4b6580;border-radius:16px;padding:17px;background:radial-gradient(circle at 50% 15%,#294f6b,#132238 70%);display:flex;flex-direction:column;justify-content:space-between;text-align:center;transition:transform .2s}.collect:hover{transform:translateY(-5px)}.collect.gold{border-color:#a18144;background:radial-gradient(circle at 50% 15%,#756038,#1b2738 70%)}.collect .emblem{font-size:60px;margin:12px}.collect .rarity{color:var(--gold);letter-spacing:2px;font-size:10px;font-weight:800}.collect strong{font-size:16px}.collect small{color:var(--muted);font-size:11px}.battle{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:center}.fighter{border-radius:15px;padding:25px;background:#142f46;text-align:center;border:1px solid #2f516d}.fighter .face{font-size:48px;margin:10px}.versus{text-align:center;font-size:22px;font-weight:900;color:var(--gold)}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:13px 0;font-size:13px}.metric span{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 20px}.toolbar select,.toolbar input{background:#14293f;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 13px;min-width:145px}.hint{font-size:12px;color:var(--muted);margin-top:12px}.empty{padding:35px;text-align:center;color:var(--muted)}.footer{margin-top:26px;text-align:center;color:#6e8aa1;font-size:12px}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.titleline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.titleline h3{margin:0}.mini{font-size:11px;color:var(--muted)}.progress{background:#20374a;border-radius:6px;height:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#43b9f4,#52e2b4)}.focus{border-color:#416b83;background:linear-gradient(135deg,#162d46,#142438)}.badge{font-size:11px;color:var(--gold)}.demo{border-left:3px solid var(--gold);padding:12px 15px;background:#2d2b2c;margin-bottom:20px;color:#eddfc1;border-radius:4px;font-size:12px}
@media(max-width:1150px){.layout{grid-template-columns:repeat(2,minmax(0,1fr))}.span4{grid-column:span 2}.grid2{grid-template-columns:1fr}}@media(max-width:720px){header{padding:0 14px}aside{width:64px;padding:15px 7px}.menu{font-size:0;justify-content:center;padding:13px 4px}.menu i{font-size:18px}aside small{display:none}main{padding:17px}.layout{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}h1{font-size:24px}.battle{grid-template-columns:1fr;gap:10px}.versus{font-size:15px}.fighter{padding:12px}.brand{font-size:19px}}
</style></head><body><header><div class="brand">SUPORTE <b>360</b> <span style="font-size:12px;color:#9dbbd0;font-weight:500">/ INTELIGÊNCIA OPERACIONAL</span></div><span class="tag">● AMBIENTE DEMONSTRATIVO</span></header>
<div class="shell"><aside><small>PAINEL</small><nav id="nav"></nav><small>AMBIENTE</small><button class="menu" onclick="resetDemo()"><i>↺</i> Reiniciar demonstração</button></aside><main><div id="view"></div><div class="footer">SUPORTE 360 • Prévia executiva de demonstração • Dados fictícios, sem banco de dados • 2026</div></main></div>
<script>
const agents=[{name:'Ana Paula',initial:'AP',chat:506,call:351,nps:93,xp:3180,win:24},{name:'Lucas Oliveira',initial:'LO',chat:506,call:351,nps:91,xp:2970,win:21},{name:'Diego Santos',initial:'DS',chat:515,call:338,nps:92,xp:2890,win:20},{name:'Fernanda Alves',initial:'FA',chat:495,call:358,nps:92,xp:2810,win:18},{name:'Bruno Lima',initial:'BL',chat:508,call:344,nps:92,xp:2680,win:17},{name:'Carla Mendes',initial:'CM',chat:492,call:353,nps:94,xp:2570,win:16}];
const cardSet=[{icon:'🏆',name:'Lenda do Atendimento',tier:'LENDÁRIA',gold:true,description:'Alcance 3.000 pontos de XP'},{icon:'⚡',name:'Resposta Relâmpago',tier:'ÉPICA',gold:true,description:'Atendimento ágil e consistente'},{icon:'💎',name:'Diamante do NPS',tier:'ÉPICA',gold:true,description:'NPS acima de +90'},{icon:'🎯',name:'Mira Certeira',tier:'RARA',description:'Alta resolução no primeiro contato'},{icon:'🔥',name:'Sequência Imbatível',tier:'RARA',description:'7 dias de evolução'},{icon:'🛡️',name:'Guardião da Qualidade',tier:'RARA',description:'Qualidade constante'},{icon:'🤝',name:'Espírito de Equipe',tier:'COMUM',description:'Colaboração e apoio'},{icon:'🌟',name:'Estrela da Semana',tier:'COMUM',description:'Destaque semanal'}];
let active='overview', charts=[], selectedAgent=0;let scores=JSON.parse(localStorage.getItem('suporte360-battles')||'{}');let imported=JSON.parse(localStorage.getItem('suporte360-imported')||'null');
const routes=[['overview','▦','Visão geral'],['ranking','🏅','Ranking'],['people','♟','Colaboradores'],['album','🃏','Álbum de cartas'],['battle','⚔','Batalhas'],['attend','◷','Atendimentos'],['executive','◈','Visão do diretor']];
const money=n=>new Intl.NumberFormat('pt-BR').format(n);const pct=n=>n.toFixed(0)+'%';const total=a=>a.chat+a.call;
function nav(){document.getElementById('nav').innerHTML=routes.map(([id,ic,name])=>'<button class="menu '+(active===id?'on':'')+'" onclick="go(\''+id+'\')"><i>'+ic+'</i> '+name+'</button>').join('')}
function go(id){active=id;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
function title(t,sub,buttons=''){return '<div class="heading"><div><h1>'+t+'</h1><p>'+sub+'</p></div><div class="actions">'+buttons+'</div></div>'}
function kpi(label,val,foot,color=''){return '<div class="card kpi"><div class="label">'+label+'</div><strong style="color:'+color+'">'+val+'</strong><div class="delta">'+foot+'</div></div>'}
function demo(){return '<div class="demo"><b>MODO APRESENTAÇÃO</b> — Os resultados exibidos são fictícios, preparados para avaliação da interface. Nenhum resultado operacional real está sendo afirmado.</div>'}
function chart(id,type,labels,data,colors){charts.push({id,type,labels,data,colors});return '<div class="chart"><canvas id="'+id+'"></canvas></div>'}
function overview(){return title('Visão geral do suporte','Performance consolidada, satisfação dos assinantes e produtividade.', '<button class="btn primary" onclick="go(\'executive\')">Ver painel do diretor →</button>')+demo()+'<div class="toolbar"><select id="period" onchange="showPeriod()"><option>Últimos 7 dias</option><option>Últimos 30 dias</option><option>Todo o período (demo)</option></select><select id="channel"><option>Todos os canais</option><option>Chat</option><option>Ligação</option></select><button class="btn" onclick="downloadCSV()">↓ Exportar CSV</button></div><div class="layout">'+kpi('Atendimentos realizados','5.117','↑ 8,4% vs. período anterior')+kpi('Chats recebidos','3.022','59% do volume')+kpi('Ligações atendidas','2.095','41% do volume')+kpi('NPS geral','+92','1.717 avaliações', 'var(--green)')+'<div class="card span2"><div class="titleline"><h3>Atendimentos por dia</h3><span class="mini">Chats + ligações</span></div>'+chart('volume','bar',['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],[[430,449,472,461,499,388,323],[280,291,306,293,311,314,300]],['#54c7f8','#416ab8'])+'</div><div class="card span2"><div class="titleline"><h3>Qualidade por canal</h3><span class="mini">NPS</span></div>'+chart('nps','doughnut',['Promotores','Neutros','Detratores'],[[88,8,4]],['#4cdeb3','#f3c778','#ff8e94'])+'</div><div class="card span4"><h3>Desempenho da equipe</h3>'+tableAgents()+'</div></div>'}
function tableAgents(){return '<div class="tablewrap"><table><thead><tr><th>Colaborador</th><th>Chat</th><th>Ligação</th><th>Total</th><th>NPS</th><th>XP</th><th>Classificação</th></tr></thead><tbody>'+agents.map((a,i)=>'<tr><td><span class="avatar">'+a.initial+'</span>'+a.name+'</td><td>'+a.chat+'</td><td>'+a.call+'</td><td>'+total(a)+'</td><td style="color:var(--green)">+'+a.nps+'</td><td>'+money(a.xp)+'</td><td><span class="pill">#'+(i+1)+'</span></td></tr>').join('')+'</tbody></table></div>'}
function ranking(){return title('Ranking de colaboradores','Gamificação orientada à qualidade: XP, desempenho e evolução.')+demo()+'<div class="layout">'+kpi('Participantes','6','Equipe demonstrativa')+kpi('XP distribuído','17.100','Pontuação demonstrativa')+kpi('Melhor NPS','+94','Carla Mendes')+kpi('Vitórias registradas','116','Batalhas demonstrativas')+'<div class="card span4"><h3>Classificação geral</h3>'+tableAgents()+'</div></div>'}
function people(){return title('Colaboradores','Conheça desempenho, evolução e conquistas da equipe.')+demo()+'<div class="cards">'+agents.map((a,i)=>'<div class="card"><div style="font-size:38px;margin-bottom:14px">👤</div><h3>'+a.name+'</h3><div class="metric"><span>Atendimentos</span><b>'+total(a)+'</b></div><div class="metric"><span>NPS</span><b>+'+a.nps+'</b></div><div class="metric"><span>Experiência</span><b>'+money(a.xp)+' XP</b></div><div class="progress" style="margin:15px 0"><div class="fill" style="width:'+(a.xp/3500*100)+'%"></div></div><button class="btn" onclick="selectedAgent='+i+';go(\'album\')">Ver coleção →</button></div>').join('')+'</div>'}
function album(){return title('Álbum de conquistas','Cartas colecionáveis por mérito, qualidade e resultados.')+demo()+'<div class="toolbar"><select id="agent" onchange="selectedAgent=+this.value;go(\'album\')">'+agents.map((a,i)=>'<option value="'+i+'" '+(i===selectedAgent?'selected':'')+'>'+a.name+'</option>').join('')+'</select><button class="btn" onclick="go(\'battle\')">⚔ Ir para batalhas</button></div><div class="card" style="margin-bottom:17px"><h3>Álbum de '+agents[selectedAgent].name+'</h3><p>Conquistas ilustrativas; regras e premiações precisam de aprovação operacional antes de uso real.</p></div><div class="cards">'+cardSet.map((c,i)=>'<div class="collect '+(c.gold?'gold':'')+'"><div class="rarity">'+c.tier+'</div><div class="emblem">'+c.icon+'</div><div><strong>'+c.name+'</strong><p><small>'+c.description+'</small></p></div></div>').join('')+'</div>'}
function battle(){let a=agents[0],b=agents[1];return title('Arena de batalhas','Desafios amistosos entre colaboradores com foco em qualidade.')+demo()+'<div class="grid2"><div class="card focus"><h3>Duelo da semana</h3><div class="battle"><div class="fighter"><div class="face">🦅</div><strong>'+a.name+'</strong><p>'+money(a.xp)+' XP</p></div><div class="versus">VS</div><div class="fighter"><div class="face">🐺</div><strong>'+b.name+'</strong><p>'+money(b.xp)+' XP</p></div></div><div class="metric"><span>Critérios sugeridos</span><b>NPS + qualidade + volume</b></div><button style="margin-top:16px;width:100%" class="btn primary" onclick="simulateBattle()">Simular batalha</button><div id="battleResult" class="hint">Simulação local, sem premiação real.</div></div><div class="card"><h3>Regras de pontuação sugeridas</h3><div class="metric"><span>NPS / qualidade</span><b>50%</b></div><div class="metric"><span>Produtividade</span><b>30%</b></div><div class="metric"><span>Regularidade</span><b>20%</b></div><p class="hint">Para evitar incentivos inadequados, volume não deve se sobrepor à qualidade. Definir mínimo de avaliações e regras contra manipulação.</p><h3 style="margin-top:22px">Último resultado simulado</h3><div id="battleHistory">'+(scores.last||'Nenhuma batalha simulada nesta sessão.')+'</div></div></div>'}
function attend(){return title('Atendimentos','Fluxo por canal, satisfação e produtividade.')+demo()+'<div class="layout">'+kpi('Total','5.117','Período demonstrativo')+kpi('Chat','3.022','NPS +90')+kpi('Ligação','2.095','NPS +96')+kpi('Taxa de avaliações','34%','1.717 respostas')+'<div class="card span2"><h3>Distribuição por horários</h3>'+chart('hours','line',['06h','08h','10h','12h','14h','16h','18h','20h','22h'],[[32,95,174,250,210,190,158,121,41]],['#4cdeb3'])+'</div><div class="card span2"><h3>Participação dos canais</h3>'+chart('channels','doughnut',['Chat','Ligação'],[[3022,2095]],['#51c9ff','#777ee9'])+'</div></div>'}
function executive(){return title('Visão do diretor','Uma leitura em 30 segundos: operação, pessoas, qualidade e prioridades.','<button class="btn primary" onclick="window.print()">Imprimir resumo</button>')+demo()+'<div class="layout">'+kpi('Volume total','5.117','↑ tendência demonstrativa')+kpi('Satisfação NPS','+92','Acima da meta ilustrativa +80','var(--green)')+kpi('Equipe analisada','6','Todos com NPS acima de +90')+kpi('Engajamento','116','Vitórias de batalha simuladas')+'<div class="card span2 focus"><h3>🟢 Pontos positivos</h3><div class="metric"><span>Satisfação elevada</span><b>NPS +92</b></div><div class="metric"><span>Equilíbrio dos canais</span><b>59% chat / 41% voz</b></div><div class="metric"><span>Engajamento</span><b>Álbum + batalhas</b></div><p class="hint">Resultados fictícios para demonstrar como o diretor receberá a leitura executiva.</p></div><div class="card span2"><h3>🎯 Próximas decisões</h3><div class="metric"><span>Integrações operacionais</span><b>Planejar</b></div><div class="metric"><span>Metas e pesos de XP</span><b>Validar</b></div><div class="metric"><span>Perfis e permissões</span><b>Definir</b></div><div class="metric"><span>Banco de dados</span><b>Fase 2</b></div></div><div class="card span4"><h3>Roadmap recomendado</h3><div class="tablewrap"><table><thead><tr><th>Fase</th><th>Entrega</th><th>Status</th></tr></thead><tbody><tr><td>1</td><td>Prévia executiva, indicadores e gamificação visual</td><td><span class="pill">Demonstrável</span></td></tr><tr><td>2</td><td>Importação real de planilhas com validação dos dados</td><td>Planejamento</td></tr><tr><td>3</td><td>Autenticação, acesso por perfil, banco, histórico e auditoria</td><td>Planejamento</td></tr></tbody></table></div></div></div>'}
function resetDemo(){localStorage.removeItem('suporte360-battles');localStorage.removeItem('suporte360-imported');scores={};go('overview')}
function simulateBattle(){let winner=Math.random()>.5?agents[0]:agents[1];scores.last='🏆 Vitória demonstrativa: '+winner.name;localStorage.setItem('suporte360-battles',JSON.stringify(scores));document.getElementById('battleResult').textContent=scores.last;document.getElementById('battleHistory').textContent=scores.last}
function showPeriod(){alert('Períodos alternativos estarão disponíveis após a integração de uma base histórica. Esta versão utiliza somente dados fictícios.')}
function downloadCSV(){let lines=['Colaborador,Chats,Ligacoes,Total,NPS,XP',...agents.map(a=>[a.name,a.chat,a.call,total(a),a.nps,a.xp].join(','))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='suporte360-demonstracao.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){charts=[];document.getElementById('view').innerHTML=({overview,ranking,people,album,battle,attend,executive}[active])();for(let c of charts){let ctx=document.getElementById(c.id);if(!ctx||typeof Chart==='undefined')continue;new Chart(ctx,{type:c.type,data:{labels:c.labels,datasets:c.data.map((values,i)=>({label:c.data.length>1?(i===0?'Chat':'Ligação'):'Indicador',data:values,backgroundColor:c.type==='doughnut'?c.colors:c.colors[i%c.colors.length],borderColor:c.colors[i%c.colors.length],borderWidth:c.type==='line'?3:0,tension:.3,fill:false,borderRadius:c.type==='bar'?5:0}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#b5cee0'}}},scales:c.type==='doughnut'?{}:{x:{ticks:{color:'#8da9bf'},grid:{display:false}},y:{ticks:{color:'#8da9bf'},grid:{color:'#233a4c'}}}}})}}
nav();render();
</script></body></html>
